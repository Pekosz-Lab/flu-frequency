# conda env create -f environment.yml && conda activate flu-freq-compare
# Works on macOS (Intel/Apple silicon) and WSL. No Docker needed.
name: flu-freq-compare
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - python-duckdb>=1.1
  - pandas>=2.1
  - numpy>=1.26
  - pyarrow>=15
  - pyyaml>=6
  - fastapi>=0.110
  - uvicorn>=0.29
  - pydantic>=2.5
  - matplotlib-base>=3.8
  - nextstrain-cli        # provides `nextstrain remote download` (used by `ffc fetch` only)
  - pytest>=8
  - httpx>=0.27
  - pip
  - pip:
      - -e .
