[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flu-freq-compare"
version = "0.4.0"
description = "Compare clade/subclade/genotype relative frequencies between JHH local and Nextstrain seasonal-flu builds, from pre-built Auspice JSONs."
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ffc = "ffc.cli:main"

[tool.setuptools]
packages = ["ffc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
